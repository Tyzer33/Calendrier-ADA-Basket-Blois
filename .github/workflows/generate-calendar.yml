name: Génération quotidienne du calendrier ADA Blois

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours à 6h UTC
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Installation des dépendances
        run: npm install

      - name: 🗓️ Génération du calendrier
        run: node index.js

      - name: 🚀 Publication sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
